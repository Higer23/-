<head>

  <style>
    :root{--bg:#030407;--text:#f3f1fa;--muted:#a9a5bd;--accent:#cfef00;--pink:#cf30aa;--indigo:#402fb5;--line:rgba(255,255,255,.11);--glass:rgba(8,8,18,.45);--r:20px}
    *,*::before,*::after{box-sizing:border-box}
    html,body{height:100%;margin:0}
    html{background:#050505}
    body{color:var(--text);font:400 16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;min-height:100%;position:relative;isolation:isolate}

    /* ipek kıvrımları: büyük diyagonal bantlar, yavaşça kayar */
    .silk{position:fixed;inset:-20%;z-index:-2;pointer-events:none;
      background:
        linear-gradient(112deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.85) 14%,rgba(0,0,0,0) 26%),
        linear-gradient(112deg,#050505 0%,#2a2a2a 12%,#e8e8e8 24%,#fbfbfb 28%,#8c8c8c 36%,#141414 46%,#050505 54%,#4a4a4a 64%,#f4f4f4 74%,#9a9a9a 82%,#101010 92%,#050505 100%);
      background-size:100% 100%,240% 240%;
      animation:silkMove 38s ease-in-out infinite alternate}
    /* ince dokuma dokusu */
    .silk::after{content:"";position:absolute;inset:0;opacity:.35;mix-blend-mode:overlay;
      background:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 1px,transparent 1px 3px),repeating-linear-gradient(-45deg,rgba(0,0,0,.35) 0 1px,transparent 1px 3px)}
    @keyframes silkMove{0%{background-position:0 0,0% 30%}50%{background-position:0 0,100% 70%}100%{background-position:0 0,30% 100%}}
    @media (prefers-reduced-motion:reduce){.silk{animation:none}}

    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px}

    .top{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px clamp(16px,4vw,32px);background:rgba(3,4,7,.5);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .brand{color:var(--text);font-weight:800;letter-spacing:-.02em;white-space:nowrap}
    .brand:hover{text-decoration:none}
    .brand span{color:var(--muted);font-weight:400}
    .lang{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font:500 .88rem Inter,sans-serif;cursor:pointer;max-width:180px}
    .lang option{background:#0b0b12;color:var(--text)}
    main{min-height:calc(100% - 58px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px clamp(16px,4vw,32px) calc(40px + env(safe-area-inset-bottom,0px))}
    .panel{max-width:640px;width:100%;padding:clamp(24px,5vw,44px);background:var(--glass);border:1px solid var(--line);border-radius:var(--r);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);text-shadow:0 1px 3px rgba(0,0,0,.85)}
    .kicker{margin:0 0 6px;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:#e58bd2}
    .code{margin:.1em 0 0;font-size:clamp(5.5rem,22vw,11rem);line-height:.95;font-weight:800;letter-spacing:-.05em;background:linear-gradient(90deg,var(--indigo),var(--pink),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
    h1{margin:.3em 0 .4em;font-size:clamp(1.5rem,5vw,2.2rem);line-height:1.15;letter-spacing:-.025em;font-weight:800}
    .lead{margin:0 auto;max-width:52ch;color:#d9d5e8}
    .ctas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font:700 15px/1 Inter,sans-serif;color:var(--text);padding:12px 22px;border-radius:100px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04)}
    .btn:hover{background:rgba(255,255,255,.16);text-decoration:none}
    .btn.primary{background:var(--accent);color:#0b0b10;border-color:transparent}
    .btn.primary:hover{background:#c4e201}
    .foot{margin-top:22px;font-size:.85rem;color:var(--muted)}
    [dir="rtl"] .brand{direction:ltr}
  </style>
</head>

    var KEY = "higer23-lang";
    var sel = document.getElementById("lang");
    var isLang = function (v) { return T.hasOwnProperty(v); };

    function detect() {
      try { var q = new URLSearchParams(location.search).get("lang"); if (q && isLang(q)) return q; } catch (e) {}
      try { var s = localStorage.getItem(KEY); if (s && isLang(s)) return s; } catch (e) {}
      var prefs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "en"];
      for (var i = 0; i < prefs.length; i++) {
        var b = String(prefs[i]).toLowerCase().split("-")[0];
        if (isLang(b)) return b;
      }
      return "en";
    }

    function apply(code) {
      var d = T[code] || T.en;
      var meta = null;
      for (var i = 0; i < LANGS.length; i++) if (LANGS[i][0] === code) meta = LANGS[i];
      document.documentElement.lang = code;
      document.documentElement.dir = meta ? meta[2] : "ltr";
      document.title = "404 · Higer23";
      document.getElementById("kicker").textContent = d.k;
      document.getElementById("h1").textContent = d.h;
      document.getElementById("lead").textContent = d.l;
      document.getElementById("foot").textContent = d.f;
      document.getElementById("btnHome").textContent = d.hm;
      document.getElementById("btnDisc").textContent = d.d;
      document.getElementById("btnMail").textContent = d.m;
      sel.setAttribute("aria-label", d.lb);
      sel.value = code;
    }

    LANGS.forEach(function (l) {
      var o = document.createElement("option");
      o.value = l[0]; o.textContent = l[1];
      sel.appendChild(o);
    });
    apply(detect());
    sel.addEventListener("change", function () {
      try { localStorage.setItem(KEY, sel.value); } catch (e) {}
      apply(sel.value);
    });
  })();
