name: Update profile snapshot

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/build-profile.mjs
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: profile-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: Higer23
        run: node scripts/build-profile.mjs

      - name: Commit if changed
        run: |
          git config user.name "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          git add app/public/data/profile.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh profile snapshot"
            git push
          fi
